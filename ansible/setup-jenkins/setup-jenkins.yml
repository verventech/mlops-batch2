---
- name: Provision Standalone Jenkins VM
  hosts: jenkins
  become: true

  tasks:
    - name: Clean up conflicting legacy Docker APT source entries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/archive_uri-https_download_docker_com_linux_ubuntu-noble.list
        - /etc/apt/sources.list.d/archive_uri-https_download_docker_com_linux_ubuntu-jammy.list

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - lsb-release
          - git
          - openssh-client
        state: present
        update_cache: true

    # --- DOCKER SETUP (Modern keyrings method) ---
    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # --- JENKINS SETUP (Modern keyrings method) ---
    - name: Download Jenkins GPG key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /etc/apt/keyrings/jenkins.asc
        mode: '0644'

    - name: Add Jenkins APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    - name: Install OpenJDK 17 and Jenkins
      ansible.builtin.apt:
        name:
          - openjdk-17-jdk
          - jenkins
        state: present

    - name: Add 'jenkins' user to 'docker' group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Ensure SSH directory exists for jenkins user
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0700'

    - name: Generate SSH Keypair for Jenkins
      community.crypto.openssh_keypair:
        path: /var/lib/jenkins/.ssh/id_rsa
        type: rsa
        size: 4096
        owner: jenkins
        group: jenkins

    - name: Disable StrictHostKeyChecking for Jenkins user SSH
      ansible.builtin.copy:
        dest: /var/lib/jenkins/.ssh/config
        content: |
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
        owner: jenkins
        group: jenkins
        mode: '0600'

    - name: Restart Jenkins service
      ansible.builtin.systemd:
        name: jenkins
        state: restarted

    # --- DISPLAY INITIAL ADMIN PASSWORD ---
    - name: Read Jenkins Initial Admin Password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password_encoded

    - name: Print Initial Admin Password
      ansible.builtin.debug:
        msg: "Jenkins Setup Complete! Initial Admin Password: {{ jenkins_password_encoded.content | b64decode | trim }}"