---
- name: Install Jenkins following official Jenkins.io documentation
  hosts: jenkins
  become: true

  tasks:
    # 1. PURGE OLD/CONFLICTING REPOSITORY FILES
    - name: Remove stale Jenkins source list files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/sources.list.d/jenkins.sources
        - /etc/apt/keyrings/jenkins-keyring.asc
        - /etc/apt/keyrings/jenkins.gpg

    - name: Strip any residual Jenkins entries from /etc/apt/sources.list
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '.*pkg\.jenkins\.io.*'
        state: absent

    # 2. PRE-REQUISITES & JAVA 21 INSTALLATION (FIRST AS RECOMMENDED)
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Update APT cache and install Java 21 & dependencies
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
          - curl
          - git
          - openssh-client
        state: present
        update_cache: true

    # 3. DOCKER ENGINE SETUP
    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # 4. OFFICIAL JENKINS LTS INSTALLATION STEPS
    # STEP A: sudo wget -O /etc/apt/keyrings/jenkins-keyring.asc https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    - name: Download Jenkins GPG key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'
        force: true

    # STEP B: echo "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" | sudo tee /etc/apt/sources.list.d/jenkins.list
    - name: Add Jenkins APT repository list file
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"
        mode: '0644'

    # STEP C: sudo apt update && sudo apt install jenkins
    - name: Update APT cache and install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    # 5. USER PERMISSIONS & SSH KEYGEN
    - name: Add 'jenkins' user to 'docker' group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Ensure SSH directory exists for jenkins user
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0700'

    - name: Generate SSH Keypair for Jenkins pipeline deployment
      community.crypto.openssh_keypair:
        path: /var/lib/jenkins/.ssh/id_rsa
        type: rsa
        size: 4096
        owner: jenkins
        group: jenkins

    - name: Disable StrictHostKeyChecking for Jenkins user SSH
      ansible.builtin.copy:
        dest: /var/lib/jenkins/.ssh/config
        content: |
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
        owner: jenkins
        group: jenkins
        mode: '0600'

    - name: Ensure Jenkins service is running and enabled
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    # 6. OUTPUT INITIAL ADMIN PASSWORD
    - name: Read Jenkins Initial Admin Password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password_encoded

    - name: Print Initial Admin Password
      ansible.builtin.debug:
        msg: "Jenkins Setup Complete! Initial Admin Password: {{ jenkins_password_encoded.content | b64decode | trim }}"