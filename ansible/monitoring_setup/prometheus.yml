global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 0. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 1. Hardware & OS Metrics (Node Exporter)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['192.168.1.99:9100']
        labels: { env: 'staging', host: 'vstg' }
      - targets: ['192.168.1.100:9100']
        labels: { env: 'production', host: 'vprod' }

  # 2. Docker Container Metrics (cAdvisor on host port 8082)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.1.99:8082']
        labels: { env: 'staging', host: 'vstg' }
      - targets: ['192.168.1.100:8082']
        labels: { env: 'production', host: 'vprod' }

  # 3. Website Uptime (Blackbox Probe on Monitoring VM 192.168.1.7:9115)
  - job_name: 'http_probe'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.1.99:8081   # Staging Website
          - http://192.168.1.100:8081  # Production Website
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.1.7:9115

  # 4. PostgreSQL Metrics (postgres_exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['192.168.1.99:9187']
        labels: { env: 'staging', host: 'vstg' }
      - targets: ['192.168.1.100:9187']
        labels: { env: 'production', host: 'vprod' }

  # Nginx Gateway Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['192.168.1.99:9113']
        labels: { env: 'staging', host: 'vstg' }
      - targets: ['192.168.1.100:9113']
        labels: { env: 'production', host: 'vprod' }

  # 5. Jenkins Metrics (Update IP to your current Jenkins server before uncommenting)
  # - job_name: 'jenkins'
  #   metrics_path: /prometheus
  #   static_configs:
  #     - targets: ['<JENKINS_VM_IP>:8080']