---
- name: Install apache with custom website playbook
  hosts: localhost
  become: yes # Run as sudo

  tasks:
    - name: Ensure apache2 is present
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Deploy custom index.html page
      copy:
        src: ./index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes